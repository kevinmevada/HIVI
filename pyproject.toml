[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hivi"
version = "0.1.0"
description = "HIVI — portable AI model library and inference runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HIVI" }]
dependencies = [
  "fastapi>=0.162.0",
  "httpx>=0.28.1",
  "huggingface-hub>=2.4.0",
  "langchain-core>=1.7.3",
  "langgraph>=1.2.19",
  "langgraph-checkpoint-sqlite>=3.0.0",
  "numpy>=2.4.6",
  "nvidia-ml-py>=13.615.71",
  "packaging>=26.3",
  "platformdirs>=4.14.2",
  "psutil>=7.2.2",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "pyside6>=6.12.0",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hivi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
